name: AXON CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run axon_parser tests
        run: cargo test -p axon_parser -- --test-threads=1
      - name: Run axon_crypto tests
        run: cargo test -p axon_crypto -- --test-threads=1
      - name: Run axon_ai_runtime tests
        run: cargo test -p axon_ai_runtime --test p63_1_attention_tests -- --test-threads=1
      - name: Run axon_wasm tests
        run: cargo test -p axon_wasm --test p61_1_jit_tests -- --test-threads=1
      - name: Run axon_lsp tests
        run: cargo test -p axon_lsp --test p64_lsp_tests -- --test-threads=1
      - name: Run axon_registry tests
        run: cargo test -p axon_registry --test p65_registry_tests -- --test-threads=1
      - name: Run axon_awp tests
        run: cargo test -p axon_awp --test p66_awp_tests -- --test-threads=1
      - name: Clippy
        run: cargo clippy --workspace -- -W warnings
