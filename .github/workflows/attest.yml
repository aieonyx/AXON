#
# EV-3 — AArch64 Attestation
#
# Public, reproducible proof that the AXONYX compiler emits AArch64
# relocatable objects linkable as seL4 Protection Domains. Every run
# publishes the object and its SHA-256 as downloadable artefacts.
#
# This workflow exists to be read by people outside the project. Keep the
# output legible.

name: AArch64 Attestation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Weekly, so the badge stays live even in quiet periods.
    - cron: '0 6 * * 1'

jobs:
  aarch64-attestation:
    name: Compile .ax to AArch64 seL4 object
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y binutils-aarch64-linux-gnu clang llvm file
          aarch64-linux-gnu-objcopy --version | head -1
          llc --version | head -3
          clang --version | head -1
        # Code generation shells out to llc and clang; both must be present
        # before the compiler can emit an object.

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: attest-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Run attestation
        run: bash scripts/attest-build.sh

      - name: Publish attestation artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aarch64-attestation-${{ github.sha }}
          path: |
            attest/out/sovereign_attest.o
            attest/out/MANIFEST.txt
            attest/out/build.log
            attest/sovereign_attest.ax
          retention-days: 90
          if-no-files-found: warn

      - name: Summary
        if: always()
        run: |
          {
            echo "## AArch64 Attestation"
            echo ""
            echo "The AXONYX compiler was built from source in this run and used"
            echo "to compile \`attest/sovereign_attest.ax\` to an AArch64"
            echo "relocatable object under the \`seL4-strict\` profile."
            echo ""
            echo '```'
            cat attest/out/MANIFEST.txt 2>/dev/null || echo "no manifest produced"
            echo '```'
            echo ""
            echo "The object and its hash are attached to this run as artefacts."
          } >> "$GITHUB_STEP_SUMMARY"
