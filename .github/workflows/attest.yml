# AArch64 Attestation
#
# Public, reproducible proof that the AXONYX compiler emits AArch64 objects
# that are linkable as seL4 Protection Domains and that execute correctly.
#
# Two stages:
#   1. attest-build.sh  — compile .ax, verify object shape and ABI gate
#   2. attest-exec.sh   — link a copy, run under qemu-aarch64, assert 0x4153
#
# Every run publishes the object, its SHA-256, the build log, and the
# execution result as downloadable artefacts.
#
# This workflow exists to be read by people outside the project. Keep the
# output legible.

name: AArch64 Attestation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Weekly, so the badge stays live during quiet periods.
    - cron: '0 6 * * 1'

jobs:
  aarch64-attestation:
    name: Compile .ax to AArch64 seL4 object and execute it
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            binutils-aarch64-linux-gnu \
            gcc-aarch64-linux-gnu \
            qemu-user \
            clang llvm file
          aarch64-linux-gnu-objcopy --version | head -1
          aarch64-linux-gnu-gcc --version | head -1
          qemu-aarch64 --version | head -1
          llc --version | head -3
          clang --version | head -1
        # Code generation shells out to llc and clang. The execution proof
        # additionally needs an aarch64 cross-compiler and user-mode QEMU.

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: attest-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Stage 1 — attestation
        run: bash scripts/attest-build.sh

      - name: Stage 2 — execution proof
        run: bash scripts/attest-exec.sh

      - name: Publish attestation artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aarch64-attestation-${{ github.sha }}
          path: |
            attest/out/sovereign_attest.o
            attest/out/MANIFEST.txt
            attest/out/build.log
            attest/sovereign_attest.ax
          retention-days: 90
          if-no-files-found: warn

      - name: Summary
        if: always()
        run: |
          {
            echo "## AArch64 Attestation"
            echo ""
            echo "The AXONYX compiler was built from source in this run and used to"
            echo "compile \`attest/sovereign_attest.ax\` to an AArch64 relocatable"
            echo "object under the \`seL4-strict\` profile. A copy of that object was"
            echo "then linked into a minimal C harness and executed under user-mode"
            echo "QEMU to confirm it returns the sovereign proof invariant."
            echo ""
            echo '```'
            cat attest/out/MANIFEST.txt 2>/dev/null || echo "no manifest produced"
            echo '```'
            echo ""
            echo "The object and its hash are attached to this run as artefacts."
          } >> "$GITHUB_STEP_SUMMARY"
