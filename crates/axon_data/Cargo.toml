[package]
name = "axon_data"
version = "0.67.0"
edition = "2021"
authors = ["Edison Lepiten <aieonyx.eu@gmail.com>"]
description = "axon_data — IAM sovereign data pipeline: ingestion, BPE tokenizer, corpus shards"
license = "Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
serde_json = "1"

[[bin]]
name = "train_tokenizer"
path = "src/bin/train_tokenizer.rs"
