[package]
name = "axon_std_io"
version = "0.45.0"
edition = "2021"
authors = ["Edison Lepiten <aieonyx.eu@gmail.com>"]
description = "axon_std::io — Sovereign I/O substrate. POSIX and seL4 backends."
license = "Apache-2.0"

[features]
default = ["backend-posix"]
backend-posix = ["libc"]
backend-sel4 = []

[dependencies]
libc = { version = "0.2", optional = true }

[dev-dependencies]
tempfile = "3"
