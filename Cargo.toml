[workspace]
resolver = "2"
members = [
    "axon_awp_ffi",
    "crates/axon_awp",
    "crates/axon_data",
    "crates/axon_interp",
    "crates/axon_pkg",
    "crates/axon_aarch64",
    "crates/axon_train",
    "axon_core",
    "axon_fs",
    "axon_genesis",
    "axon_drivers",
    "axon_alloc",
    "axon_pal",
    "axon_pal_linux",
    "axon_pal_sel4",
    "axon_pal_macos",
    "axon_pal_windows",
    "axon_integration",
    "axon_verify_core",
    "axon_lexer",
    "axon_parser",
    "axon_rt",
    "axon_std",
    "crates/axon_std/io",
    "crates/axon_std/string",
    "crates/axon_build",
    "crates/axon_link",
    "crates/axon_lex",
    "crates/axon_parse",
    "crates/axon_hir",
    "crates/axon_infer",
    "crates/axon_codegen",
    "crates/axon_native",
    "crates/axonc",
    "crates/axon_runtime",
    "crates/axon_net",
    "crates/axon_crypto",
    "crates/axon_ct_check",
    "crates/axon_gpu",
    "crates/axon_media",
    "crates/axon_layout",
    "crates/axon_wasm",
    "crates/axon_font",
    "crates/axon_ai_runtime",
    "crates/axon_lsp",
    "crates/axon_registry",
    "axon_cli",
    "axon_sel4",
    "axon_math",
    "axon_tensor",
    "axon_learn",
    "axon_compute", 
# REMOVED(p13-m1):     "axon_codegen",
    "axon_rt",
    "axon_std",
# REMOVED(p13-m1):     "axon_llvm",
# REMOVED(p13-m1):     "axon_ai",
    "axon_cli",
    "axon_sel4",
]

# Workspace-wide dependency versions
[workspace.dependencies]
axon_core    = { path = "axon_core"    }
    axon_lexer   = { path = "axon_lexer"   }
axon_parser  = { path = "axon_parser"  }
# REMOVED(p13-m1): axon_codegen = { path = "axon_codegen" }
axon_rt      = { path = "axon_rt"      }
axon_std     = { path = "axon_std"     }
# REMOVED(p13-m1): axon_llvm    = { path = "axon_llvm"    }
# REMOVED(p13-m1): axon_ai     = { path = "axon_ai"      }

[workspace.metadata]
description = "AXON — AI-Native Programming Language"
authors     = ["Edison Lepiten <aieonyx.eu@gmail.com>"]
license     = "SEE LICENSE FILE"
repository  = "https://github.com/aieonyx/axon"

[profile.release]
panic = "abort"

[profile.dev]
panic = "abort"
